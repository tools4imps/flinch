name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The full mutation run takes too long for every push, so it runs once a week and on demand.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # go.mod names the oldest Go flinch supports. "stable" is what releases are built with.
        go: ["1.25", "stable"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test suite
        run: go test -race -timeout 30m ./...

  # flinch holds itself to its own Contract. The static check is quick and runs every time. Pull
  # requests also mutate the lines they change, and the weekly run mutates everything.
  self:
    name: flinch on flinch
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build
        run: go build -o flinch ./cmd/flinch

      - name: The Contract's own files
        run: ./flinch contract

      - name: Mutate the change
        if: github.event_name == 'pull_request'
        run: ./flinch --since "origin/${{ github.base_ref }}"

      - name: Mutate everything
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: ./flinch
